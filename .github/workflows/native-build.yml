name: Native desktop foundation

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "engine/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "engine/**"
      - ".github/workflows/native-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: macos-latest
            preset: macos-release
          - os: ubuntu-latest
            preset: linux-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux audio and GUI development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libgtk-3-dev libjack-jackd2-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure JUCE engine
        run: cmake --preset ${{ matrix.preset }}
        working-directory: engine

      - name: Build JUCE engine
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: engine

      - name: Test JUCE engine
        run: ctest --preset ${{ matrix.preset }}
        working-directory: engine

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Typecheck, test, and build desktop app
        run: |
          npm run typecheck
          npm run test
          npm run build
        working-directory: apps/desktop
